<html>
<head>
    <title>BaseOS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="desktop">
        <div id="taskbar">
            <div id="start-menu-button">
                <img src="logo.png" id="start-logo">
            </div>
            <div id="app-title">BaseOS</div>
            <div id="menu-items">
                <span class="menu-header" data-menu="file">File</span>
                <span class="menu-header" data-menu="edit">Edit</span>
                <span class="menu-header" data-menu="view">View</span>
                <span class="menu-header" data-menu="help">Help</span>
            </div>
            <div id="time"></div>
        </div>

        <div class="dropdown-menu" id="file-menu">
            <div class="menu-item" data-action="new">New</div>
            <div class="menu-item" data-action="open">Open</div>
            <div class="menu-item" data-action="save">Save</div>
            <div class="menu-item" data-action="save-as">Save As</div>
            <div class="menu-item" data-action="print">Print</div>
            <div class="menu-item" data-action="close">Close</div>
        </div>

        <div class="dropdown-menu" id="edit-menu">
            <div class="menu-item" data-action="undo">Undo</div>
            <div class="menu-item" data-action="redo">Redo</div>
            <div class="menu-item" data-action="cut">Cut</div>
            <div class="menu-item" data-action="copy">Copy</div>
            <div class="menu-item" data-action="paste">Paste</div>
            <div class="menu-item" data-action="select-all">Select All</div>
        </div>

        <div class="dropdown-menu" id="view-menu">
            <div class="menu-item" data-action="zoom-in">Zoom In</div>
            <div class="menu-item" data-action="zoom-out">Zoom Out</div>
            <div class="menu-item" data-action="full-screen">Full Screen</div>
        </div>

        <div class="dropdown-menu" id="help-menu">
            <div class="menu-item" data-action="about">About BaseOS</div>
            <div class="menu-item" data-action="help">Help Center</div>
        </div>

        <div id="dock">
			<div class="dock-icon" data-app="assistant">
				<img src="assistant.png">
			</div>
            <div class="dock-icon" data-app="finder">
                <img src="files.png">
            </div>
            <div class="dock-icon" data-app="browser">
                <img src="browser.png">
            </div>
            <div class="dock-icon" data-app="appstore">
                <img src="asset_appstore.png">
            </div>
            <div class="dock-icon" data-app="write">
                <img src="wordprocessor.png">
            </div>
            <div class="dock-icon" data-app="graphs">
                <img src="asset_spreadsheet.png">
            </div>
            <div class="dock-icon" data-app="notes">
                <img src="notes.png">
            </div>
            <div class="dock-icon" data-app="calendar">
                <img src="calendar.png">
            </div>
            <div class="dock-icon" data-app="chat">
                <img src="chat.png">
            </div>
            <div class="dock-icon" data-app="email">
                <img src="email.png">
            </div>
            <div class="dock-icon" data-app="calculator">
                <img src="calculator.png">
            </div>
            <div class="dock-icon" data-app="games">
                <img src="games.png">
            </div>
            <div class="dock-icon" data-app="vsquares">
                <img src="asset_vm.png">
            </div>
            <div class="dock-icon" data-app="settings">
                <img src="settings.png">
            </div>
            <div class="dock-icon" data-app="terminal">
                <img src="terminal.png">
            </div>
            <div class="dock-icon" data-app="trash">
                <img src="trash.png">
            </div>
        </div>

        <div id="desktop-icons">
            <div class="desktop-icon" data-app="finder">
                <img src="files.png">
                <span>Files</span>
            </div>
            <div class="desktop-icon" data-app="browser">
                <img src="browser.png">
                <span>Browser</span>
            </div>
            <div class="desktop-icon" data-app="appstore">
                <img src="asset_appstore.png">
                <span>App Store</span>
            </div>
            <div class="desktop-icon" data-app="write">
                <img src="wordprocessor.png">
                <span>Write</span>
            </div>
            <div class="desktop-icon" data-app="graphs">
                <img src="asset_spreadsheet.png">
                <span>Graphs</span>
            </div>
            <div class="desktop-icon" data-app="notes">
                <img src="notes.png">
                <span>Notes</span>
            </div>
            <div class="desktop-icon" data-app="calendar">
                <img src="calendar.png">
                <span>Calendar</span>
            </div>
            <div class="desktop-icon" data-app="chat">
                <img src="chat.png">
                <span>Chat</span>
            </div>
            <div class="desktop-icon" data-app="email">
                <img src="email.png">
                <span>Email</span>
            </div>
            <div class="desktop-icon" data-app="calculator">
                <img src="calculator.png">
                <span>Calculator</span>
            </div>
            <div class="desktop-icon" data-app="games">
                <img src="games.png">
                <span>Games</span>
            </div>
            <div class="desktop-icon" data-app="vsquares">
                <img src="asset_vm.png">
                <span>VSquares</span>
            </div>
            <div class="desktop-icon" data-app="settings">
                <img src="settings.png">
                <span>Settings</span>
            </div>
            <div class="desktop-icon" data-app="terminal">
                <img src="terminal.png">
                <span>Terminal</span>
            </div>
            <div class="desktop-icon" data-app="trash">
                <img src="trash.png">
                <span>Trash</span>
            </div>
        </div>

        <!-- Window Templates -->
        <div id="windows"></div>
        
        <!-- File dialogs -->
        <div id="save-dialog" class="dialog hidden">
            <div class="dialog-content">
                <h3>Save File</h3>
                <input type="text" id="save-filename" placeholder="filename">
                <div class="dialog-buttons">
                    <button id="save-cancel">Cancel</button>
                    <button id="save-confirm">Save</button>
                </div>
            </div>
        </div>
        
        <div id="open-dialog" class="dialog hidden">
            <div class="dialog-content">
                <h3>Open File</h3>
                <div id="file-list"></div>
                <div class="dialog-buttons">
                    <button id="open-cancel">Cancel</button>
                    <button id="open-confirm">Open</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
